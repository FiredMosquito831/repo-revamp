name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the plugin and marketplace manifests
        run: python scripts/validate_plugin.py
      - name: Check the verification script's help
        run: python scripts/verify_site.py --help
      - name: Check the inventory script's help
        run: python scripts/shots_inventory.py --help
