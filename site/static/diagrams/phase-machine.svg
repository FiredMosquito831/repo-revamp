<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="pm-title pm-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="pm-title">The repo-revamp phase state machine</title>
  <desc id="pm-desc">Eight phases in order: INTAKE, SPEC, BUILD, REVIEW, DEPLOY, SEO, SHIP and CLOSE. Each phase box carries its exit gate underneath: RECON.md exists, USER DECISIONS recorded, gate green and draft PR open, V1 to V16 green, live URLs answer, sitemap submitted, merged on the owner's go, tracker and handoff updated. Arrows connect the phases in sequence.</desc>
  <defs>
    <marker id="pm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3FB950"/>
    </marker>
  </defs>

  <text x="20" y="30" fill="#E6EDF3" font-size="19" font-weight="700">The phase state machine</text>
  <text x="20" y="50" fill="#9FB0C0" font-size="13">A phase's exit gate must be green before the next phase starts.</text>

  <!-- row 1 -->
  <g>
    <rect x="20" y="70" width="220" height="96" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="42" cy="94" r="6" fill="#3FB950"/>
    <text x="58" y="99" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-monospace, Consolas, monospace">INTAKE</text>
    <text x="36" y="130" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">phase 0</text>
    <text x="36" y="150" fill="#9FB0C0" font-size="12">read-only recon</text>
    <text x="20" y="190" fill="#9FB0C0" font-size="11" letter-spacing="1.2">EXIT GATE</text>
    <text x="20" y="208" fill="#E6EDF3" font-size="13">RECON.md exists</text>
  </g>
  <line x1="240" y1="118" x2="256" y2="118" stroke="#3FB950" stroke-width="2" marker-end="url(#pm-arrow)"/>

  <g>
    <rect x="260" y="70" width="220" height="96" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="282" cy="94" r="6" fill="#3FB950"/>
    <text x="298" y="99" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-monospace, Consolas, monospace">SPEC</text>
    <text x="276" y="130" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">phase 1</text>
    <text x="276" y="150" fill="#9FB0C0" font-size="12">numbered questions</text>
    <text x="260" y="190" fill="#9FB0C0" font-size="11" letter-spacing="1.2">EXIT GATE</text>
    <text x="260" y="208" fill="#E6EDF3" font-size="13">USER DECISIONS</text>
    <text x="260" y="224" fill="#E6EDF3" font-size="13">recorded</text>
  </g>
  <line x1="480" y1="118" x2="496" y2="118" stroke="#3FB950" stroke-width="2" marker-end="url(#pm-arrow)"/>

  <g>
    <rect x="500" y="70" width="220" height="96" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="522" cy="94" r="6" fill="#3FB950"/>
    <text x="538" y="99" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-monospace, Consolas, monospace">BUILD</text>
    <text x="516" y="130" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">phase 2</text>
    <text x="516" y="150" fill="#9FB0C0" font-size="12">one delegated agent</text>
    <text x="500" y="190" fill="#9FB0C0" font-size="11" letter-spacing="1.2">EXIT GATE</text>
    <text x="500" y="208" fill="#E6EDF3" font-size="13">gate green,</text>
    <text x="500" y="224" fill="#E6EDF3" font-size="13">draft PR open</text>
  </g>
  <line x1="720" y1="118" x2="736" y2="118" stroke="#3FB950" stroke-width="2" marker-end="url(#pm-arrow)"/>

  <g>
    <rect x="740" y="70" width="220" height="96" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="762" cy="94" r="6" fill="#3FB950"/>
    <text x="778" y="99" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-monospace, Consolas, monospace">REVIEW</text>
    <text x="756" y="130" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">phase 3</text>
    <text x="756" y="150" fill="#9FB0C0" font-size="12">the orchestrator verifies</text>
    <text x="740" y="190" fill="#9FB0C0" font-size="11" letter-spacing="1.2">EXIT GATE</text>
    <text x="740" y="208" fill="#E6EDF3" font-size="13">V1–V16 green</text>
  </g>

  <!-- connector from REVIEW down to DEPLOY -->
  <path d="M 850 166 L 850 236 L 130 236 L 130 258" fill="none" stroke="#3FB950" stroke-width="2" marker-end="url(#pm-arrow)"/>
  <text x="490" y="228" fill="#9FB0C0" font-size="12" text-anchor="middle">continues</text>

  <!-- row 2 -->
  <g>
    <rect x="20" y="270" width="220" height="96" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="42" cy="294" r="6" fill="#3FB950"/>
    <text x="58" y="299" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-monospace, Consolas, monospace">DEPLOY</text>
    <text x="36" y="330" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">phase 4</text>
    <text x="36" y="350" fill="#9FB0C0" font-size="12">coordinator and owner</text>
    <text x="20" y="390" fill="#9FB0C0" font-size="11" letter-spacing="1.2">EXIT GATE</text>
    <text x="20" y="408" fill="#E6EDF3" font-size="13">live URLs answer</text>
  </g>
  <line x1="240" y1="318" x2="256" y2="318" stroke="#3FB950" stroke-width="2" marker-end="url(#pm-arrow)"/>

  <g>
    <rect x="260" y="270" width="220" height="96" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="282" cy="294" r="6" fill="#3FB950"/>
    <text x="298" y="299" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-monospace, Consolas, monospace">SEO</text>
    <text x="276" y="330" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">phase 5</text>
    <text x="276" y="350" fill="#9FB0C0" font-size="12">sitemap and metadata</text>
    <text x="260" y="390" fill="#9FB0C0" font-size="11" letter-spacing="1.2">EXIT GATE</text>
    <text x="260" y="408" fill="#E6EDF3" font-size="13">sitemap submitted</text>
  </g>
  <line x1="480" y1="318" x2="496" y2="318" stroke="#3FB950" stroke-width="2" marker-end="url(#pm-arrow)"/>

  <g>
    <rect x="500" y="270" width="220" height="96" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="522" cy="294" r="6" fill="#3FB950"/>
    <text x="538" y="299" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-monospace, Consolas, monospace">SHIP</text>
    <text x="516" y="330" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">phase 6</text>
    <text x="516" y="350" fill="#9FB0C0" font-size="12">on the owner's go</text>
    <text x="500" y="390" fill="#9FB0C0" font-size="11" letter-spacing="1.2">EXIT GATE</text>
    <text x="500" y="408" fill="#E6EDF3" font-size="13">merged on the</text>
    <text x="500" y="424" fill="#E6EDF3" font-size="13">owner's go</text>
  </g>
  <line x1="720" y1="318" x2="736" y2="318" stroke="#3FB950" stroke-width="2" marker-end="url(#pm-arrow)"/>

  <g>
    <rect x="740" y="270" width="220" height="96" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="762" cy="294" r="6" fill="#3FB950"/>
    <text x="778" y="299" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-monospace, Consolas, monospace">CLOSE</text>
    <text x="756" y="330" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">phase 7</text>
    <text x="756" y="350" fill="#9FB0C0" font-size="12">record and hand off</text>
    <text x="740" y="390" fill="#9FB0C0" font-size="11" letter-spacing="1.2">EXIT GATE</text>
    <text x="740" y="408" fill="#E6EDF3" font-size="13">tracker and</text>
    <text x="740" y="424" fill="#E6EDF3" font-size="13">handoff updated</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="20" y="440" width="960" height="1" fill="#6B7B92"/>
    <circle cx="34" cy="458" r="5" fill="#3FB950"/>
    <text x="46" y="462" fill="#9FB0C0" font-size="12">phase</text>
    <rect x="106" y="450" width="16" height="16" rx="3" fill="#111821" stroke="#6B7B92"/>
    <text x="130" y="462" fill="#9FB0C0" font-size="12">exit gate</text>
    <line x1="204" y1="458" x2="232" y2="458" stroke="#3FB950" stroke-width="2" marker-end="url(#pm-arrow)"/>
    <text x="240" y="462" fill="#9FB0C0" font-size="12">next phase</text>
  </g>
</svg>
