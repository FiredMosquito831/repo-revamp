<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="if-title if-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="if-title">The install flow</title>
  <desc id="if-desc">Four steps in order: add the marketplace with the plugin marketplace add command, install the plugin from the danube-labs marketplace, restart Claude Code, then run the revamp command on a repository. Arrows connect the steps in sequence.</desc>
  <defs>
    <marker id="if-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3FB950"/>
    </marker>
  </defs>

  <text x="20" y="30" fill="#E6EDF3" font-size="19" font-weight="700">From zero to a first revamp</text>
  <text x="20" y="50" fill="#9FB0C0" font-size="13">Four steps, run inside Claude Code.</text>

  <g>
    <rect x="20" y="80" width="215" height="130" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="44" cy="104" r="12" fill="#3FB950"/>
    <text x="44" y="109" fill="#04130A" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="64" y="109" fill="#E6EDF3" font-size="15" font-weight="600">Add the marketplace</text>
    <text x="36" y="140" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">/plugin marketplace add</text>
    <text x="36" y="160" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">FiredMosquito831/</text>
    <text x="36" y="180" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">repo-revamp</text>
  </g>
  <line x1="235" y1="145" x2="256" y2="145" stroke="#3FB950" stroke-width="2" marker-end="url(#if-arrow)"/>

  <g>
    <rect x="265" y="80" width="215" height="130" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="289" cy="104" r="12" fill="#3FB950"/>
    <text x="289" y="109" fill="#04130A" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="309" y="109" fill="#E6EDF3" font-size="15" font-weight="600">Install the plugin</text>
    <text x="281" y="140" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">/plugin install</text>
    <text x="281" y="160" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">repo-revamp@danube-labs</text>
    <text x="281" y="188" fill="#9FB0C0" font-size="12">or one step with --marketplace</text>
  </g>
  <line x1="480" y1="145" x2="501" y2="145" stroke="#3FB950" stroke-width="2" marker-end="url(#if-arrow)"/>

  <g>
    <rect x="510" y="80" width="215" height="130" rx="10" fill="#111821" stroke="#6B7B92" stroke-width="1.5"/>
    <circle cx="534" cy="104" r="12" fill="#3FB950"/>
    <text x="534" y="109" fill="#04130A" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="554" y="109" fill="#E6EDF3" font-size="15" font-weight="600">Restart Claude Code</text>
    <text x="526" y="140" fill="#9FB0C0" font-size="12">The skill, commands and</text>
    <text x="526" y="160" fill="#9FB0C0" font-size="12">agents load in a new</text>
    <text x="526" y="180" fill="#9FB0C0" font-size="12">session.</text>
  </g>
  <line x1="725" y1="145" x2="746" y2="145" stroke="#3FB950" stroke-width="2" marker-end="url(#if-arrow)"/>

  <g>
    <rect x="755" y="80" width="225" height="130" rx="10" fill="#18212C" stroke="#3FB950" stroke-width="2"/>
    <circle cx="779" cy="104" r="12" fill="#3FB950"/>
    <text x="779" y="109" fill="#04130A" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="799" y="109" fill="#E6EDF3" font-size="15" font-weight="600">Revamp a repository</text>
    <text x="771" y="140" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">/repo-revamp:revamp</text>
    <text x="771" y="160" fill="#9FB0C0" font-size="12" font-family="ui-monospace, Consolas, monospace">my-old-project</text>
    <text x="771" y="188" fill="#9FB0C0" font-size="12">starts at INTAKE</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="20" y="240" width="960" height="1" fill="#6B7B92"/>
    <circle cx="34" cy="263" r="7" fill="#3FB950"/>
    <text x="48" y="267" fill="#9FB0C0" font-size="12">step number</text>
    <line x1="140" y1="263" x2="168" y2="263" stroke="#3FB950" stroke-width="2" marker-end="url(#if-arrow)"/>
    <text x="176" y="267" fill="#9FB0C0" font-size="12">next step</text>
    <rect x="260" y="254" width="16" height="16" rx="3" fill="#18212C" stroke="#3FB950" stroke-width="2"/>
    <text x="284" y="267" fill="#9FB0C0" font-size="12">the command that starts a revamp</text>
  </g>
</svg>
